name: Release Please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest

    steps:
      - name: Release Please
        uses: googleapis/release-please-action@v4
        with:
          # Prefer a PAT so the tag push can trigger the cargo-dist Release workflow.
          # GITHUB_TOKEN events do not start other workflows (GitHub anti-recursion).
          # Fallback keeps release-please working until RELEASE_PLEASE_TOKEN is set.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json